<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Twrvetuloa tänne</title>
</head>
<style>
   



p.NewElement1 {
text-align: center;
font-family: Cursive;
font-size: 22px;
font-style: italic;
font-weight: bold;
text-decoration: none;
text-transform: uppercase;
color: #fe2aec;
background-color: #adef6e;
}

</style>
<body>

    <div id="container">
        <h1>Tervetuloa</h1>
        <h2>Tälle</h2>
        <h3>Mystiselle</h3>
        <h4>Sivustolle...</h4>
        <h5>Paina</h5>
        <h6>Tuosta</h6>
        <h7>Napista</h7>
        <div><h8>Alla...</h8></div>
        <button id="nappi">!!!Paina Tätä!!!</button>
    </div>
 
  <script>
    const button = document.getElementById('nappi');
    const container = document.getElementById('container');
    button.addEventListener('click', () => {
  // 1. Remove all previous elements inside the container
  container.innerHTML = '';
        

  // 2. Create and add new elements
  const newElement1 = document.createElement('p');
  newElement1.textContent='Hyvää isänpäivää!!';
  newElement1.className='NewElement1';
  

  container.appendChild(newElement1);
 
    });
  </script>


</body>


</html>
